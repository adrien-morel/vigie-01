# Continuous build and deployment, triggered by a push on the default branch.
#
# What this pipeline does: tests, builds an image, pushes it, then points the service *and* the Job
# at that commit's image.
#
# What it never does, and what must not be added to it: `gcloud run jobs execute`. A run consumes the
# daily cap of 200 LLM calls (backend/guardrails.py). Triggered by push, it would empty the budget on
# every commit and the scheduler's execution — the only one that produces the digest — would have
# nothing left to spend. Triggering the pipeline belongs to Cloud Scheduler, alone
# (infra/README.md §7).
#
# The runtime configuration (environment variables, secrets, caps, timeouts) is deliberately not
# here: it is set once by the runbook (§5 and §6), and these steps touch only the image.
# `run ... update --image` preserves the rest; a full `deploy` with --set-env-vars would rewrite it on
# every push, and a forgotten MAX_LLM_CALLS_PER_DAY in this file would only show on the first run
# running with no guardrail.
#
# The front is not in this pipeline (§8): it lives on Firebase Hosting, needs separate credentials,
# and since `VITE_API_BASE` is frozen into the bundle at build time, rebuilding it only makes sense
# when the API's URL or the front itself changes — not on every backend commit.

substitutions:
  _REGION: europe-west1
  _REPO: vigie
  _SERVICE: vigie-api
  _JOB: vigie-daily

options:
  # Mandatory as soon as the trigger runs under a dedicated service account with no log bucket:
  # without this option, the build is refused before its first step.
  logging: CLOUD_LOGGING_ONLY

# Two installs of the grpc stack, plus lxml since article fetching was added: the 10-minute default
# is tight.
timeout: 1800s

steps:
  # The repository's safety net, replayed here. GitHub Actions covers the same ground on the same
  # push, but the two triggers are independent: without this step, a commit whose tests fail goes to
  # production while the Actions tab turns red.
  - id: tests
    name: python:3.13-slim
    env:
      # backend/config.py has no default value for these two caps: their absence fails the import,
      # and therefore test collection.
      - MAX_STEPS_PER_RUN=20
      - MAX_LLM_CALLS_PER_DAY=200
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install --no-cache-dir -q -r backend/requirements-dev.txt
        ruff check .
        ruff format --check .
        pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vigie-01:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vigie-01:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vigie-01"]

  # Deployment by SHA and not by `latest`: when an overnight run misbehaves, the revision must say
  # which version was running. `latest` is pushed for the runbook's manual commands, not to decide
  # what executes.
  - id: deploy-service
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vigie-01:$SHORT_SHA

  # Updates the Job's image without running it: the next execution will be the scheduler's, and it
  # will pick up this image.
  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_JOB}
      - --region=${_REGION}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/vigie-01:$SHORT_SHA
